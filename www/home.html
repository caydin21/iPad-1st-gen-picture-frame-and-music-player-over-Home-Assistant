<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  Home — iPad 1 (iOS 5.1.1)
  Clock, photo frame and music player on one screen; swipe left/right to switch, there are no buttons for it.
  Each screen is its own file (clock.html / photos.html / music.html), which also work on their own.
  - Jumps to the music screen when Music Assistant starts playing; goes back a few minutes after it stops.
  - Banners for a robot vacuum, a washing machine and Alexa timers appear on top of whatever screen is showing.
  - Optional: pick the screen from HA (input_select, two-way), reload the iPad from HA (input_button),
    a once-a-minute status line in HA (input_text), and a night blackout.
  - Reloads itself when the files on the server change (so the iPad's cache never gets in the way).
-->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Home</title>
<style>
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#000;color:#e8ecee;
 font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
 -webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:rgba(0,0,0,0)}
.track{position:absolute;top:0;left:0;height:100%;-webkit-transform:translate3d(0,0,0)}
.track.anim{-webkit-transition:-webkit-transform .42s cubic-bezier(.2,.8,.2,1)}
.pane{position:absolute;top:0;overflow:hidden;background:#000}
.pane iframe{display:block;border:0;margin:0;padding:0;background:#000}
.dots{position:absolute;left:50%;bottom:8px;width:60px;margin-left:-30px;height:10px;text-align:center;font-size:0;
 pointer-events:none;opacity:0;-webkit-transition:opacity .6s}
.dots.on{opacity:1}
.dots i{display:inline-block;width:6px;height:6px;border-radius:3px;margin:2px 4px;background:rgba(255,255,255,.35)}
.dots i.cur{background:rgba(255,255,255,.9)}

/* status banners (robot, washer): they don't catch touches, so swiping still works under them */
.stack{position:absolute;top:18px;left:50%;width:476px;margin-left:-238px;pointer-events:none}
.bn{position:relative;padding:12px 18px 14px;margin-bottom:10px;border-radius:20px;display:none;
 background:rgba(20,24,26,.88);border:1px solid rgba(255,255,255,.1);-webkit-box-shadow:0 10px 30px rgba(0,0,0,.5);
 opacity:0;-webkit-transform:translate3d(0,-20px,0);-webkit-transition:opacity .5s,-webkit-transform .5s}
.bn.vis{display:block}
.bn.on{opacity:1;-webkit-transform:translate3d(0,0,0)}
.bn svg{position:absolute;left:18px;top:14px;width:30px;height:30px;stroke:#8aaecf;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bn .t{margin-left:44px;font-size:17px;line-height:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bn .s{margin-left:44px;font-size:14px;line-height:20px;color:#a9b3b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bn .bar{margin:10px 0 0 44px;height:5px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden}
.bn .bar i{display:block;height:5px;width:0;border-radius:3px;background:#8aaecf;-webkit-transition:width 1s}
.bn.err svg{stroke:#ef9a9a}.bn.err .bar i{background:#ef9a9a}
.bn.warn svg{stroke:#ffcc80}.bn.warn .bar i{background:#ffcc80}
.bn.done svg{stroke:#81c784}.bn.done .bar i{background:#81c784}
.bn.nobar .bar{display:none}

/* night: black cover over everything; a tap lifts it for a minute */
.night{position:absolute;top:0;left:0;right:0;bottom:0;background:#000;display:none;opacity:0;-webkit-transition:opacity 2s}
.night.vis{display:block}
.night.on{opacity:1}
</style>
</head>
<body>
<div class="track"></div>
<div class="dots"></div>
<div class="stack"></div>
<div class="night"></div>
<script>
(function () {
"use strict";

/* ======================= SETTINGS ======================= */
var CONFIG = {
  token: "",
  // screens, left to right
  pages: ["clock.html", "photos.html", "music.html"],
  musicPage: 2,                                   // screen to jump to when music starts
  musicBackAfter: 180,                            // seconds after the music stops to go back (0 = stay)
  musicBackTo: 1,                                 // screen to go back to if the previous one isn't known (1 = photos)
  screenSelect: null,                             // pick the screen from HA (two-way), e.g.
  // screenSelect: { entity: "input_select.frame_screen", options: ["Clock", "Photos", "Music"] },   // options in the order of pages
  night: null,                                    // night blackout, e.g.
  // night: { from: "23:00", to: "07:00", wake: 60, keepOnIf: ["light.living_room"] },   // tap = on for "wake" seconds; stays on while a light is on
  reloadButton: "",                               // input_button in HA that reloads the iPad, e.g. "input_button.frame_reload"
  status: "",                                     // input_text the iPad writes a status line into every minute, e.g. "input_text.frame_status"
  // Alexa timers: the input_text filled by the automation in homeassistant/automations.yaml (instant) and/or
  // the "next timer" sensors of the Alexa Devices integration (these can lag by minutes). [] = off
  timers: [],                                     // e.g. ["input_text.frame_timer", "sensor.echo_dot_next_timer"]
  player: "media_player.living_room_speaker",     // Music Assistant player
  vacuum: "vacuum.robot",
  vacSensors: {                                   // sensors next to the robot (any can be left empty)
    progress: "sensor.robot_cleaning_progress",
    area: "sensor.robot_cleaning_area",
    time: "sensor.robot_cleaning_time",
    battery: "sensor.robot_battery",
    room: "sensor.robot_current_room",
    error: "sensor.robot_error"

  washer: {                                       // washing machine (Home Connect Local); leave state empty to hide
    name: "",                                     // shown name (empty = "Washer" / "Çamaşır makinesi")
    state: "sensor.washer_operation_state",
    progress: "sensor.washer_program_progress",
    finish: "sensor.washer_program_finish_time",
    program: "select.washer_active_program",
    temperature: "select.washer_temperature",

  lang: "auto",                                   // "auto" | "tr" | "en"

var VERSION = "2.0.0";
// UI language: "auto" follows the iPad's language (Turkish if it is set to Turkish, otherwise English)
var LANG = (CONFIG.lang === "tr" || CONFIG.lang === "en") ? CONFIG.lang : (/^tr/i.test(navigator.language || "") ? "tr" : "en");
var L10N = {

    washer: "Çamaşır makinesi", run: "{n} yıkıyor", wpause: "{n} duraklatıldı", delayed: "{n}: gecikmeli başlatma",
    action: "{n}: müdahale gerekiyor", werror: "{n}: hata", aborting: "{n}: program iptal ediliyor", ready: "Çamaşırlar hazır",
    doorOpen: "Kapı açık", takeOut: "Kapıyı açıp çamaşırları alabilirsiniz", left: "{v} kaldı", ends: "Bitiş {v}",
    cold: "Soğuk", rpm: "{v} dev/dk", noSpin: "Sıkmasız",
    timer: "Zamanlayıcı", timerDone: "Zamanlayıcı bitti", screens: ["Saat", "Fotoğraflar", "Müzik"],
    prog: { cotton: "Pamuklu", cotton_eco_4060: "Eco 40-60", easy_care: "Sentetik", mix: "Karışık", wool: "Yünlü",
      delicates_silk: "Narin / İpek", shirts_blouses: "Gömlek / Bluz", sport_fitness: "Spor", sport_shoes: "Spor ayakkabı",
      dark_wash: "Koyu renkler", outdoor: "Outdoor", curtains: "Perde", super_153045_super_15: "Hızlı 15'",
      super_153045_super_1530: "Hızlı 15/30'", towels: "Havlu", mix_night_wash: "Gece yıkama", allergy_plus: "Allergy+",
      hygiene_plus: "Hijyen+", rinse_rinse_spin_drain: "Durulama", rinse_spin_drain: "Sıkma", drum_clean: "Tambur temizliği",
      down_duvet_duvet: "Yorgan", baby_care: "Bebek", jeans: "Kot", synthetic_refresh: "Tazeleme", mix_quick: "Hızlı karışık" }
  },
  en: {
    min: "min", hr: "h", cleaning: "{n} is cleaning", returning: "{n} is returning to the dock", paused: "{n} is paused",
    error: "{n}: error", cleaned: "{n} finished cleaning", battery: "Battery {v}%", pct: "{v}%",
    washer: "Washer", run: "{n} is washing", wpause: "{n} is paused", delayed: "{n}: delayed start",
    action: "{n}: action required", werror: "{n}: error", aborting: "{n}: aborting program", ready: "Laundry is ready",
    doorOpen: "Door is open", takeOut: "Open the door and take the laundry out", left: "{v} left", ends: "Ends {v}",
    cold: "Cold", rpm: "{v} rpm", noSpin: "No spin",
    timer: "Timer", timerDone: "Timer done", screens: ["Clock", "Photos", "Music"],
    prog: { cotton: "Cotton", cotton_eco_4060: "Eco 40-60", easy_care: "Easy care", mix: "Mix", wool: "Wool",
      delicates_silk: "Delicates / Silk", shirts_blouses: "Shirts / Blouses", sport_fitness: "Sportswear", sport_shoes: "Trainers",
      dark_wash: "Dark wash", outdoor: "Outdoor", curtains: "Curtains", super_153045_super_15: "Super quick 15'",
      super_153045_super_1530: "Super quick 15/30'", towels: "Towels", mix_night_wash: "Night wash", allergy_plus: "Allergy+",
      hygiene_plus: "Hygiene+", rinse_rinse_spin_drain: "Rinse", rinse_spin_drain: "Spin / drain", drum_clean: "Drum clean",
      down_duvet_duvet: "Duvet", baby_care: "Baby care", jeans: "Jeans", synthetic_refresh: "Refresh", mix_quick: "Quick mix" }
  }
};
var T = L10N[LANG];
function tt(key, n, v) { return T[key].replace("{n}", n).replace("{v}", v); }
var LAST_ERR = "";
window.onerror = function (msg, url, line) { LAST_ERR = String(msg).slice(0, 80) + " @" + line; };
var PAGES = CONFIG.pages;

function sget(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }

  var h = hasC(el, c);
  if (on && !h) el.className = (el.className ? el.className + " " : "") + c;
  else if (!on && h) el.className = (" " + el.className + " ").replace(" " + c + " ", " ").replace(/^\s+|\s+$/g, "");

var track = document.querySelector(".track"), dots = document.querySelector(".dots");
var panes = [], frames = [], W = 0, H = 0;
var idx = parseInt(sget("frameScreen"), 10);
if (!(idx >= 0 && idx < PAGES.length)) idx = 0;

/* ---------------- build ---------------- */
var stamp = ms();   // fresh URLs: HA lets browsers cache /local files for a month
for (var i = 0; i < PAGES.length; i++) {
  var p = document.createElement("div"); p.className = "pane";
  var f = document.createElement("iframe");
  f.setAttribute("frameborder", "0"); f.setAttribute("scrolling", "no");
  p.appendChild(f); track.appendChild(p);
  panes.push(p); frames.push(f);
  var d = document.createElement("i"); dots.appendChild(d);
  (function (f) { f.onload = function () { hook(f); }; })(f);
}

function size() {
  W = window.innerWidth; H = window.innerHeight;
  track.style.width = (W * PAGES.length) + "px";
  for (var i = 0; i < panes.length; i++) {
    var p = panes[i], f = frames[i];
    p.style.left = (i * W) + "px"; p.style.width = W + "px"; p.style.height = H + "px";
    f.style.width = W + "px"; f.style.height = H + "px"; f.width = W; f.height = H;
  }
  place(0, false);
}
function place(dx, anim) {
  tglC(track, "anim", !!anim);

}
var dotT = 0;
function showDots() {
  var ds = dots.getElementsByTagName("i");
  for (var i = 0; i < ds.length; i++) ds[i].className = i === idx ? "cur" : "";
  tglC(dots, "on", true); clearTimeout(dotT);
  dotT = setTimeout(function () { tglC(dots, "on", false); }, 1500);
}
var backIdx = null;   // where to return to when the music stops
function go(n) {
  n = Math.max(0, Math.min(PAGES.length - 1, n));
  var changed = n !== idx;
  if (changed && n === CONFIG.musicPage) backIdx = idx;
  if (changed && n !== CONFIG.musicPage) { backIdx = null; clearTimeout(backT); backT = 0; }
  idx = n; sset("frameScreen", String(idx));
  place(0, true);
  if (changed) { showDots(); reportScreen(); }
}

/* ---------------- swipe ----------------

   Capture phase: we see the gesture before the page's own buttons do. A move that is
   clearly sideways becomes a screen swipe; anything else is left to the page. */

    var t = e.touches[0], dx = t.clientX - g.x, dy = t.clientY - g.y;

      else if (Math.abs(dy) > 14) { g.mode = 2; return; }                              // vertical → page's own scrolling
      else return;

    e.preventDefault();

    g.dx = dx;

    if (g.mode === 1) {

      if (g.dx < -W * 0.18 || v < -0.45) go(idx + 1);
      else if (g.dx > W * 0.18 || v > 0.45) go(idx - 1);
      else go(idx);
    }
    g = null;
  }
  doc.addEventListener("touchend", end, true);
  doc.addEventListener("touchcancel", end, true);

/* ---------------- Home Assistant ---------------- */
var BASE = String(CONFIG.haUrl || "").replace(/\/+$/, "");

  x.onreadystatechange = function () {

    cb(j);
  };
  x.open("GET", BASE + "/api/states/" + id + "?_=" + ms(), true);
  x.setRequestHeader("Authorization", "Bearer " + token());
  x.send(null);
}

/* music: jump to the player when Music Assistant starts playing,
   and go back to the previous screen a few minutes after it stops */
var lastPlayer = null, backT = 0;
function pollPlayer() {
  state(CONFIG.player, function (j) {
    var s = j ? j.state : null;
    if (lastPlayer !== null && s === "playing" && lastPlayer !== "playing" && idx !== CONFIG.musicPage && !g) go(CONFIG.musicPage);
    if (s === "playing") { clearTimeout(backT); backT = 0; manualMusic = false; }
    else if (s && idx === CONFIG.musicPage && !backT && !manualMusic && CONFIG.musicBackAfter > 0) {
      backT = setTimeout(function () {
        backT = 0;
        if (idx === CONFIG.musicPage && lastPlayer !== "playing" && !g) go(backIdx !== null ? backIdx : CONFIG.musicBackTo);
      }, CONFIG.musicBackAfter * 1000);
    }
    if (s) lastPlayer = s;
    setTimeout(pollPlayer, 3000);
  });
}

/* ---------------- status banners ---------------- */
var $stack = document.querySelector(".stack");
function banner(icon) {
  var el = document.createElement("div"); el.className = "bn";
  el.innerHTML = '<svg viewBox="0 0 24 24">' + icon + '</svg><div class="t"></div><div class="s"></div><div class="bar"><i></i></div>';
  $stack.appendChild(el);
  var b = { el: el, t: el.querySelector(".t"), s: el.querySelector(".s"), bar: el.querySelector(".bar i"), hideT: 0 };
  return b;
}
// kind: "" | "err" | "warn" | "done"; pct: null hides the bar
function bnShow(b, title, sub, pct, kind) {
  clearTimeout(b.hideT); b.hideT = 0;
  b.t.textContent = title; b.s.textContent = sub;
  tglC(b.el, "nobar", pct == null);
  if (pct != null) b.bar.style.width = Math.max(0, Math.min(100, pct)) + "%";
  tglC(b.el, "err", kind === "err"); tglC(b.el, "warn", kind === "warn"); tglC(b.el, "done", kind === "done");
  if (!hasC(b.el, "vis")) { tglC(b.el, "vis", true); void b.el.offsetWidth; }
  tglC(b.el, "on", true);

}
function bnHide(b) {
  if (!hasC(b.el, "on")) return;
  tglC(b.el, "on", false);
  syncDate();
  b.hideT = setTimeout(function () { b.hideT = 0; tglC(b.el, "vis", false); }, 550);
}
// while a banner is up, hide the date at the top of the clock screen (they would overlap)

  var up = false, list = $stack.childNodes, i;
  for (i = 0; i < list.length; i++) if (hasC(list[i], "on")) up = true;
  for (i = 0; i < frames.length; i++) {
    if (!/clock/.test(PAGES[i])) continue;
    try {
      var d = frames[i].contentDocument && frames[i].contentDocument.querySelector(".date");
      if (!d) continue;
      d.style.webkitTransition = "opacity .5s";
      d.style.opacity = up ? "0" : "";
    } catch (e) { /* not loaded yet */ }
  }

setInterval(syncDate, 2000);
function num(v) { var n = parseFloat(v); return isFinite(n) ? n : null; }
function dur(sec) {
  if (sec == null) return "";
  var m = Math.round(sec / 60);

/* robot vacuum */
var vacB = banner('<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.2"/><path d="M7 6.5l1.4 1.4M17 6.5l-1.4 1.4"/>');
var VS = { was: null, doneT: 0 };
var ACTIVE = { cleaning: 1, returning: 1, paused: 1, error: 1 };
var ERR_NONE = { none: 1, no_error: 1, ok: 1, unknown: 1, unavailable: 1, "": 1 };
function pollVacuum() {
  state(CONFIG.vacuum, function (j) {
    var s = j ? j.state : null, name = (j && j.attributes && j.attributes.friendly_name) || "Robot";
    if (s && ACTIVE[s]) {
      clearTimeout(VS.doneT); VS.doneT = 0; VS.was = s;
      readMany(CONFIG.vacSensors, function (I) { showVac(s, name, I); });
    } else if (s) {
      if (VS.was && VS.was !== "error") {
        // just finished: show a short summary for a minute, then hide
        VS.was = null;
        readMany(CONFIG.vacSensors, function (I) {
          showVac("done", name, I);
          clearTimeout(VS.doneT);
          VS.doneT = setTimeout(function () { VS.doneT = 0; bnHide(vacB); }, 60000);
        });
      } else if (!VS.doneT) { VS.was = null; bnHide(vacB); }
    }
    setTimeout(pollVacuum, s && ACTIVE[s] ? 8000 : 15000);
  });
}
function showVac(s, name, I) {
  var p = num(I.progress), area = num(I.area), t = num(I.time), bat = num(I.battery);
  var room = I.room, title, sub = [];
  var err = I.error && !ERR_NONE[String(I.error).toLowerCase()] ? I.error : null;
  if (s === "cleaning") title = tt("cleaning", name) + (room ? " · " + room : "");
  else if (s === "returning") title = tt("returning", name);
  else if (s === "paused") title = tt("paused", name) + (room ? " · " + room : "");
  else if (s === "error") title = tt("error", name) + (err ? " · " + err : "");
  else title = tt("cleaned", name);
  if (s !== "done" && p != null) sub.push(tt("pct", "", Math.round(p)));
  if (area != null) sub.push(area + " m²");
  if (t != null) sub.push(dur(t));
  if (bat != null) sub.push(tt("battery", "", Math.round(bat)));
  bnShow(vacB, title, sub.join("  ·  "), s === "done" ? 100 : p, s === "error" ? "err" : (s === "done" ? "done" : ""));
}

/* washing machine (Home Connect) */
var washB = banner('<rect x="4" y="2.5" width="16" height="19" rx="2.5"/><circle cx="12" cy="13.5" r="5"/><path d="M7 6h.01M10 6h.01"/><path d="M9.5 14.5c1.2-1 3.8 1 5 0"/>');
var WS = { was: null };
var W_ACTIVE = { run: 1, pause: 1, delayedstart: 1, actionrequired: 1, error: 1, aborting: 1, finished: 1 };
var PROG = T.prog;
function progName(v) {
  if (!v) return "";
  var k = String(v).replace(/^.*_washer_program_/, "").replace(/^laundry_care_/, "");
  if (PROG[k]) return PROG[k];
  k = k.replace(/_/g, " ");
  return k.charAt(0).toUpperCase() + k.slice(1);
}
function tempName(v) {
  if (!v) return "";
  var m = /g_c_(\d+)$/.exec(v); if (m) return m[1] + "°C";
  if (/cold$/.test(v)) return T.cold;
  return "";
}
function spinName(v) {
  if (!v) return "";
  var m = /r_p_m_(\d+)$/.exec(v); if (m) return tt("rpm", "", m[1]);
  if (/_off$/.test(v)) return T.noSpin;
  return "";
}
function pollWasher() {
  var C = CONFIG.washer;
  if (!C || !C.state) return;
  state(C.state, function (j) {
    var s = j ? j.state : null;
    if (s && W_ACTIVE[s]) {
      WS.was = s;
      readMany(C, function (I) { showWasher(s, I); });
    } else if (s) { WS.was = null; bnHide(washB); }
    setTimeout(pollWasher, s && W_ACTIVE[s] && s !== "finished" ? 10000 : 20000);
  });
}
function showWasher(s, I) {
  var name = CONFIG.washer.name || T.washer, p = num(I.progress), fin = parseISO(I.finish), now = ms();
  var prog = progName(I.program), sub = [], title, kind = "";
  if (s === "run") title = tt("run", name) + (prog ? " · " + prog : "");
  else if (s === "pause") title = tt("wpause", name) + (prog ? " · " + prog : "");
  else if (s === "delayedstart") title = tt("delayed", name) + (prog ? " · " + prog : "");
  else if (s === "actionrequired") { title = tt("action", name); kind = "warn"; }
  else if (s === "error") { title = tt("werror", name); kind = "err"; }
  else if (s === "aborting") title = tt("aborting", name);
  else { title = T.ready; kind = "done"; }
  if (s === "finished") {
    if (prog) sub.push(prog);
    sub.push(I.door === "open" ? T.doorOpen : T.takeOut);
  } else {
    if (p != null && s !== "delayedstart") sub.push(tt("pct", "", Math.round(p)));
    if (isFinite(fin) && fin > now) {
      sub.push(tt("left", "", dur((fin - now) / 1000)));
      sub.push(tt("ends", "", hhmm(fin)));
    }
    var t = tempName(I.temperature), sp = spinName(I.spin);
    if (t) sub.push(t);
    if (sp) sub.push(sp);
  }
  bnShow(washB, title, sub.join("  ·  "), s === "finished" ? 100 : (s === "delayedstart" ? null : p), kind);
}
/* Alexa timers (Alexa Media Player "next timer" sensors): a banner counting down to the end */
var timB = banner('<circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4l2.5 1.5M10 3h4M12 3v3M18.5 6.5l1.2-1.2"/>');
var TM = { end: 0, id: "", total: 0, name: "", label: "", tick: 0, doneT: 0, cancelled: [] };
function mmss(sec) {
  sec = Math.max(0, Math.round(sec));
  var h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), x = sec % 60;
  return (h ? h + ":" + (m < 10 ? "0" : "") : "") + m + ":" + (x < 10 ? "0" : "") + x;
}
// details of the first active timer from the sensor's attributes (format varies between versions)
function timerInfo(a, end) {
  var out = { total: 0, label: "" }, list = a && (a.sorted_active || a.sorted_all);
  if (typeof list === "string") { try { list = JSON.parse(list); } catch (e) { list = null; } }
  if (!list || !list.length) return out;
  for (var i = 0; i < list.length; i++) {
    var t = list[i] && list[i].length === 2 ? list[i][1] : list[i];
    if (!t || (t.status && t.status !== "ON")) continue;
    out.total = +t.originalDurationInMillis || 0;
    out.label = t.timerLabel || "";
    break;
  }
  return out;
}
function pollTimers() {
  var ids = CONFIG.timers || [], left = ids.length, cands = [], gone = false;
  if (!left) return;
  for (var i = 0; i < ids.length; i++) (function (id) {
    state(id, function (j) {
      var parts = j && j.state ? String(j.state).split("|") : [], t = parts.length ? parseISO(parts[0]) : NaN;
      // the entity that holds our timer now answers with something else -> the timer was cancelled.
      // ("unavailable" doesn't count: the Alexa sensors drop out for a few seconds whenever the link to Amazon hiccups)
      if (TM.tick && id === TM.id && j && j.state !== "unavailable" && j.state !== "unknown" && t !== TM.end) gone = true;
      if (isFinite(t) && t > ms() - 2000) cands.push({ t: t, j: j, id: id, parts: parts });
      if (--left) return;
      if (gone && TM.end - ms() > 3000) TM.cancelled.push(TM.end);   // remember it: the slow Alexa sensor may still show it
      var best = null, k, c, n;
      for (k = 0; k < cands.length; k++) {
        c = cands[k];
        for (n = 0; n < TM.cancelled.length; n++) if (Math.abs(c.t - TM.cancelled[n]) < 15000) c = null;
        if (c && (!best || c.t < best.t - 5000)) best = c;
      }
      if (best) {
        var a = best.j.attributes || {}, info = timerInfo(a, best.t);
        if (best.parts.length > 1) { info.total = +best.parts[1] || 0; a = { friendly_name: best.parts[2] || "" }; }
        clearTimeout(TM.doneT); TM.doneT = 0;
        TM.end = best.t; TM.id = best.id; TM.total = info.total; TM.label = info.label;
        TM.name = String(a.friendly_name || "").replace(/\s*(Bir sonraki zamanlay\u0131c\u0131|Next timer|Nächster Timer)\s*$/i, "");
        if (!TM.tick) { TM.tick = setInterval(timerTick, 1000); timerTick(); }
      } else if (gone && TM.tick) {   // cancelled before the end
        clearInterval(TM.tick); TM.tick = 0; TM.end = 0; bnHide(timB);
      }
      while (TM.cancelled.length > 5) TM.cancelled.shift();
      setTimeout(pollTimers, TM.tick ? 5000 : 8000);
    });
  })(ids[i]);
}
function timerTick() {
  var left = (TM.end - ms()) / 1000;
  if (left <= 0) {
    clearInterval(TM.tick); TM.tick = 0;
    bnShow(timB, T.timerDone + (TM.label ? " · " + TM.label : ""), TM.name, 100, "done");
    clearTimeout(TM.doneT); TM.doneT = setTimeout(function () { TM.doneT = 0; bnHide(timB); }, 60000);
    return;
  }
  var sub = [tt("ends", "", hhmm(TM.end))]; if (TM.name) sub.push(TM.name);
  var pct = TM.total > 0 ? 100 * (1 - left * 1000 / TM.total) : null;
  bnShow(timB, T.timer + (TM.label ? " · " + TM.label : "") + "  " + mmss(left), sub.join("  ·  "), pct, "");
}

/* heartbeat: once a minute the iPad writes a short status line into an input_text in HA,
   so you can see from HA that the frame is alive and what it is showing */
function pad2(n) { return (n < 10 ? "0" : "") + n; }
function heartbeat() {
  if (CONFIG.status && token()) {
    var d = new Date(), names = T.screens;
    var line = "v" + VERSION + " · " + pad2(d.getHours()) + ":" + pad2(d.getMinutes()) + ":" + pad2(d.getSeconds()) +
      " · " + (names[idx] || idx) + (TM.tick ? " · timer " + mmss((TM.end - ms()) / 1000) : "") +
      (SKEW ? " · clock offset " + Math.round(SKEW / 60000) + " min" : "") + (LAST_ERR ? " · error: " + LAST_ERR : "");
    svc("input_text", "set_value", { entity_id: CONFIG.status, value: line.slice(0, 250) });
  }
  setTimeout(heartbeat, 60000);
}
setTimeout(heartbeat, 6000);

function sizeStack() { var w = Math.min(476, W - 40); $stack.style.width = w + "px"; $stack.style.marginLeft = (-w / 2) + "px"; }

/* ---------------- start ---------------- */
document.addEventListener("touchmove", function (e) { e.preventDefault(); }, false);
window.addEventListener("orientationchange", function () { setTimeout(function () { size(); sizeStack(); }, 150); }, false);
window.addEventListener("resize", function () { setTimeout(function () { size(); sizeStack(); }, 80); }, false);
size(); sizeStack();
// load the visible screen first, the others shortly after (gentler on the iPad 1)
frames[idx].src = PAGES[idx] + "?v=" + stamp;
setTimeout(function () {
  for (var i = 0; i < frames.length; i++) if (i !== idx) frames[i].src = PAGES[i] + "?v=" + stamp;
}, 1500);
showDots();
if (token()) { setTimeout(pollPlayer, 2000); setTimeout(pollVacuum, 3000); setTimeout(pollWasher, 4000); setTimeout(pollTimers, 5000); }

/* ---------------- self-update ----------------
   HA serves /local files with a 31-day cache, so an old copy of this page can keep coming back
   (e.g. reloading a Safari tab). On start we compare our VERSION with the file on the server, and
   every 5 minutes we watch the Last-Modified time of this page and the screens; on any change we
   restart under a fresh URL. */
var SELF = location.pathname.substring(location.pathname.lastIndexOf("/") + 1) || "home.html";
function fresh() { location.replace(SELF + "?v=" + ms()); }
function fetchText(url, method, cb) {
  var x = new XMLHttpRequest();
  x.onreadystatechange = function () { if (x.readyState === 4) cb(x.status === 200 ? x : null); };
  x.open(method, url + "?v=" + ms(), true); x.send(null);
}
fetchText(SELF, "GET", function (x) {
  var m = x && /var VERSION = "([^"]+)"/.exec(x.responseText);
  if (m && m[1] !== VERSION) fresh();
});
var STAMPS = {};
function checkUpdates() {
  var files = [SELF].concat(PAGES), left = files.length, changed = false;
  for (var i = 0; i < files.length; i++) (function (f) {
    fetchText(f, "HEAD", function (x) {
      var lm = x && x.getResponseHeader("Last-Modified");
      if (lm) { if (STAMPS[f] && STAMPS[f] !== lm) changed = true; STAMPS[f] = lm; }
      if (--left === 0 && changed) fresh();
    });
  })(files[i]);
}
setTimeout(checkUpdates, 10000);
setInterval(checkUpdates, 5 * 60 * 1000);

/* ---------------- night mode ---------------- */
var $night = document.querySelector(".night"), wakeUntil = 0, nightOn = false, lightsOn = false;
function mins(hm) { var p = String(hm || "").split(":"); return (+p[0] || 0) * 60 + (+p[1] || 0); }
function isNight() {
  var N = CONFIG.night; if (!N) return false;
  var d = new Date(), m = d.getHours() * 60 + d.getMinutes(), a = mins(N.from), b = mins(N.to);
  return a <= b ? (m >= a && m < b) : (m >= a || m < b);   // the range may cross midnight
}
function nightTick() {
  var want = isNight() && !lightsOn && ms() > wakeUntil;
  if (want === nightOn) return;
  nightOn = want;
  if (want) { tglC($night, "vis", true); void $night.offsetWidth; tglC($night, "on", true); }
  else { tglC($night, "on", false); setTimeout(function () { if (!nightOn) tglC($night, "vis", false); }, 2100); }
}
// while dark, a tap shows the screen again for a while (the tap itself doesn't reach the page below)
function wake(e) { if (e) e.preventDefault(); wakeUntil = ms() + ((CONFIG.night && CONFIG.night.wake) || 60) * 1000; nightTick(); }
$night.addEventListener("touchstart", wake, false);
$night.addEventListener("click", wake, false);
// lights in the room keep the screen on (checked every 20 s, only during the night hours)
function pollLights() {
  var ids = (CONFIG.night && CONFIG.night.keepOnIf) || [], left = ids.length, any = false;
  if (!left || !isNight() || !token()) { if (lightsOn) { lightsOn = false; nightTick(); } setTimeout(pollLights, 20000); return; }
  for (var i = 0; i < ids.length; i++) (function (id) {
    state(id, function (j) {
      if (j && j.state === "on") any = true;
      if (--left === 0) {
        if (any !== lightsOn) { lightsOn = any; nightTick(); }
        setTimeout(pollLights, 20000);
      }
    });
  })(ids[i]);
}
nightTick();
setInterval(nightTick, 15000);
pollLights();

/* ---------------- screen choice from Home Assistant ----------------
   the screenSelect input_select mirrors the screen shown here: picking an option in HA switches
   the iPad (and lights up the screen at night for a while); swiping or an automatic switch
   on the iPad writes the new screen back to HA. */
var selSeen = null, selSetAt = 0, manualMusic = false;
function svc(domain, service, data) {
  var x = new XMLHttpRequest();
  x.open("POST", BASE + "/api/services/" + domain + "/" + service, true);
  x.setRequestHeader("Authorization", "Bearer " + token());
  x.setRequestHeader("Content-Type", "application/json");
  x.send(JSON.stringify(data));
}
function reportScreen() {
  var S = CONFIG.screenSelect; if (!S || !token()) return;
  var opt = S.options[idx]; if (!opt || opt === selSeen) return;
  selSeen = opt; selSetAt = ms();
  svc("input_select", "select_option", { entity_id: S.entity, option: opt });
}
function pollSelect() {
  var S = CONFIG.screenSelect; if (!S || !token()) return;
  state(S.entity, function (j) {
    if (j && j.state) {
      var s = j.state, k = -1, i;
      for (i = 0; i < S.options.length; i++) if (S.options[i] === s) k = i;
      if (selSeen === null) { selSeen = s; if (k !== idx) { selSeen = null; reportScreen(); } }   // first look: HA follows the iPad
      else if (s !== selSeen && ms() - selSetAt > 2500) {
        selSeen = s;
        if (k >= 0 && k !== idx && !g) {
          manualMusic = k === CONFIG.musicPage;   // chosen by hand: don't bounce back while nothing plays
          go(k);
          if (nightOn) wake();
        }
      }
    }
    setTimeout(pollSelect, 2000);
  });
}
setTimeout(pollSelect, 2500);

/* ---------------- remote reload ----------------
   Pressing the input_button in HA changes its state (the time of the press);
   when we see it change, the whole app reloads with fresh copies of every page. */
var reloadSeen = null;
function pollReload() {
  var id = CONFIG.reloadButton; if (!id || !token()) return;
  state(id, function (j) {
    if (j && j.state) {
      if (reloadSeen === null) reloadSeen = j.state;
      else if (j.state !== reloadSeen) { fresh(); return; }
    }
    setTimeout(pollReload, 4000);
  });
}
setTimeout(pollReload, 3000);
if (window.console) console.log("Home v" + VERSION);
})();
</script>
</body>
