<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<!--
  CleanFrame Salon Kumandası — iPad (1. nesil, iOS 5.1.1)  v1.1.0
  LG TV kumandası: güç, yön tuşları, ses, kanal, uygulamalar, oynatma ve Hue Sync.
  Sadece ES5 + HA REST API. Kurulum: /config/www/ içine koyun, iPad'de
  http://<HA-IP>:8123/local/remote.html adresini açıp "Ana Ekrana Ekle".
-->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="format-detection" content="telephone=no">
<title>Salon</title>
<style>
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#000;color:#e8ecee;
 font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-text-size-adjust:none;
 -webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:rgba(0,0,0,0)}
svg{stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hide{display:none!important}
#card{position:absolute;top:12px;left:12px;right:12px;bottom:12px;overflow:hidden;border-radius:26px;
 border:1px solid rgba(255,255,255,.09);background:#111517;background:-webkit-linear-gradient(top,#171c1e,#0c0f10)}

/* header */
.hd{position:absolute;top:22px;left:28px;right:28px;height:60px}
.st{position:absolute;left:0;top:0;right:330px}
.st .n{font-family:"HelveticaNeue-Medium","Helvetica Neue",Helvetica,Arial,sans-serif;font-size:28px;line-height:34px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st .s{font-size:16px;line-height:24px;color:#a9b3b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{display:inline-block;width:11px;height:11px;border-radius:6px;background:#66bb6a;margin-right:9px;vertical-align:0}
.dot.off{background:#7a8287}.dot.wait{background:#ffa600;-webkit-animation:cfp 1.2s infinite}.dot.err{background:#e53935}
@-webkit-keyframes cfp{50%{opacity:.3}}
.pw{position:absolute;right:0;top:0;width:60px;height:60px;border-radius:30px;background:rgba(232,236,238,.08)}
.pw svg{position:absolute;left:17px;top:17px;width:26px;height:26px}
.pw.on{background:#8aaecf;color:#10161a}
.lt{position:absolute;right:76px;top:6px;height:48px}
.chip{display:inline-block;height:46px;line-height:46px;padding:0 18px;margin-left:8px;border-radius:23px;font-size:16px;
 background:rgba(232,236,238,.06);border:1px solid rgba(232,236,238,.08);color:#c9d1d5;white-space:nowrap}
.chip i{display:inline-block;width:9px;height:9px;border-radius:5px;background:#5c6569;margin-right:8px;vertical-align:1px}
.chip.on{color:#e8ecee;border-color:rgba(138,174,207,.6)}
.chip.on i{background:#8aaecf;-webkit-box-shadow:0 0 8px #8aaecf}

/* body columns */
.bd{position:absolute;top:100px;left:28px;right:28px;bottom:24px}
.cl{position:absolute;top:0;bottom:0;left:0;width:330px}
.cm{position:absolute;top:0;bottom:0;left:350px;width:120px}
.cr{position:absolute;top:0;bottom:0;left:490px;right:0}

/* d-pad */
.pad{position:relative;width:300px;height:300px;margin:0 auto;border-radius:150px;background:rgba(232,236,238,.05);border:1px solid rgba(232,236,238,.08)}
.pk{position:absolute;color:#e8ecee}
.pk svg{position:absolute;width:30px;height:30px}
.pk.u{left:100px;top:0;width:100px;height:96px}.pk.u svg{left:35px;top:28px}
.pk.d{left:100px;bottom:0;width:100px;height:96px}.pk.d svg{left:35px;top:38px}
.pk.l{left:0;top:100px;width:96px;height:100px}.pk.l svg{left:28px;top:35px}
.pk.r{right:0;top:100px;width:96px;height:100px}.pk.r svg{left:38px;top:35px}
.pk.ok{left:95px;top:95px;width:110px;height:110px;border-radius:55px;background:rgba(232,236,238,.1);font-size:22px;line-height:110px;text-align:center;
 font-family:"HelveticaNeue-Medium","Helvetica Neue",Helvetica,Arial,sans-serif}
.pk.down{color:#8aaecf}
.pk.ok.down{background:#8aaecf;color:#10161a}
.nav{width:300px;margin:18px auto 0;text-align:center;font-size:0}
.nb{display:inline-block;width:88px;height:56px;margin:0 6px;border-radius:28px;background:rgba(232,236,238,.08);position:relative;font-size:13px;color:#c9d1d5}
.nb svg{position:absolute;left:31px;top:8px;width:24px;height:24px}
.nb span{position:absolute;left:0;right:0;bottom:6px;text-align:center}
.nb.down,.rk.down,.app.down,.chip.down,.pw.down,.pb.down,.src.down,.x.down{background:rgba(232,236,238,.22)}

/* volume / channel rockers */
.rk{position:relative;width:110px;border-radius:30px;background:rgba(232,236,238,.08);margin:0 auto}
.rk div{position:absolute;left:0;right:0;height:72px;text-align:center;font-size:34px;line-height:72px}
.rk .a{top:0}.rk .b{bottom:0}
.rk .lbl{top:50%;height:20px;margin-top:-10px;font-size:13px;line-height:20px;color:#98a3a8}
.rk.vol,.rk.ch{height:200px}
.rk.ch{margin-top:16px}
.rk div.down{background:rgba(232,236,238,.18);border-radius:30px}
.vb{width:110px;height:6px;margin:12px auto 0;border-radius:3px;background:rgba(232,236,238,.18);overflow:hidden}
.vb i{display:block;height:6px;width:0;background:#8aaecf;-webkit-transition:width .2s}
.mute{display:block;width:110px;height:48px;margin:12px auto 0;border-radius:24px;background:rgba(232,236,238,.08);position:relative}
.mute svg{position:absolute;left:42px;top:12px;width:24px;height:24px}
.mute.on{background:#e57373;color:#10161a}
.mute.down{background:rgba(232,236,238,.22)}

/* apps */
.apps{font-size:0;margin-right:-12px}
.app{display:inline-block;vertical-align:top;position:relative;height:82px;margin:0 12px 12px 0;border-radius:18px;
 background:rgba(232,236,238,.06);border:1px solid rgba(232,236,238,.08);overflow:hidden}
.app b{position:absolute;left:0;top:0;bottom:0;width:6px}
.app span{position:absolute;left:20px;right:10px;top:0;line-height:82px;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app.cur{border-color:#8aaecf;background:rgba(138,174,207,.14)}
.app.cf span{font-family:"HelveticaNeue-Medium","Helvetica Neue",Helvetica,Arial,sans-serif}
.app.cf{background:rgba(138,174,207,.1)}

/* playback */
.pbr{width:300px;margin:12px auto 0;height:56px;text-align:center;font-size:0}
.pb{display:inline-block;width:66px;height:56px;border-radius:28px;margin:0 4px;background:rgba(232,236,238,.08);position:relative}
.pb svg{position:absolute;left:21px;top:16px;width:24px;height:24px}

/* source list overlay */
.sl{position:absolute;top:0;left:0;right:0;bottom:0;background:#0f1314;background:-webkit-linear-gradient(top,#151a1c,#0c0f10)}
.sl .h{position:absolute;top:16px;left:20px;right:20px;height:52px;text-align:center;font-family:"HelveticaNeue-Medium","Helvetica Neue",Helvetica,Arial,sans-serif;font-size:24px;line-height:52px}
.sl .x{position:absolute;right:20px;top:18px;width:48px;height:48px;border-radius:24px;background:rgba(232,236,238,.08);font-size:22px;line-height:48px;text-align:center}
.sl .ll{position:absolute;top:84px;left:12px;right:12px;bottom:12px;overflow-x:hidden;overflow-y:scroll;-webkit-overflow-scrolling:touch}
.src{position:relative;height:60px;line-height:60px;margin:0 8px 4px;padding:0 20px;border-radius:14px;font-size:18px;-webkit-transform:translate3d(0,0,0);
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src.cur{color:#8aaecf}
.bn{padding:40px 20px;text-align:center;color:#98a3a8;font-size:18px}

/* toast */
.toast{position:absolute;left:50%;bottom:34px;width:420px;margin-left:-210px;padding:12px 18px;border-radius:14px;background:rgba(229,57,53,.92);
 color:#fff;font-size:15px;text-align:center;opacity:0;-webkit-transition:opacity .3s;pointer-events:none}
.toast.on{opacity:1}

/* portrait */
.port .st{right:76px}
.port .lt{top:76px;right:auto;left:-8px}
.port .bd{top:168px}
.port .cl{width:330px;left:30px}
.port .cm{left:auto;right:30px;width:150px}
.port .cr{left:0;right:0;top:476px;bottom:0}
.port .rk.vol,.port .rk.ch{height:150px}.port .rk.ch{margin-top:14px}.port .rk div{height:56px;line-height:56px}

/* setup */
.setup{position:absolute;top:0;left:0;right:0;bottom:0;background:#0c0f10;padding:40px}
.setup h1{font-weight:normal;font-size:28px;margin:0 0 12px}
.setup p{font-size:17px;line-height:25px;color:#a9b3b8;margin:0 0 16px}
.setup .err{color:#ff8a80}
.setup textarea{display:block;width:100%;height:150px;box-sizing:border-box;-webkit-box-sizing:border-box;border-radius:14px;
 border:1px solid rgba(232,236,238,.18);background:#151a1c;color:#e8ecee;font-size:15px;padding:14px;font-family:Menlo,Courier,monospace;-webkit-appearance:none;outline:none;-webkit-user-select:text}
.setup .save{display:inline-block;margin-top:18px;height:52px;line-height:52px;padding:0 34px;border-radius:26px;background:#8aaecf;color:#10161a;font-size:19px}
</style>
</head>

<div id="card">
 <div class="hd">
  <div class="st"><div class="n"></div><div class="s"><i class="dot off"></i><span></span></div></div>
  <div class="lt"><div class="chip" data-l="sync"><i></i><span></span></div></div>
  <div class="pw"></div>
 </div>
 <div class="bd">
  <div class="cl">
   <div class="pad">
    <div class="pk u" data-k="UP"></div><div class="pk d" data-k="DOWN"></div>
    <div class="pk l" data-k="LEFT"></div><div class="pk r" data-k="RIGHT"></div>
    <div class="pk ok" data-k="ENTER">OK</div>
   </div>
   <div class="nav">
    <div class="nb" data-k="BACK"></div><div class="nb" data-k="HOME"></div><div class="nb" data-k="MENU"></div>
   </div>
   <div class="pbr">
    <div class="pb" data-k="REWIND"></div><div class="pb" data-k="PLAY"></div><div class="pb" data-k="PAUSE"></div><div class="pb" data-k="FASTFORWARD"></div>
   </div>
  </div>
  <div class="cm">
   <div class="rk vol"><div class="a" data-v="up">+</div><div class="lbl"></div><div class="b" data-v="down">&#8722;</div></div>
   <div class="vb"><i></i></div>
   <div class="mute"></div>
   <div class="rk ch"><div class="a" data-k="CHANNELUP">&#8963;</div><div class="lbl"></div><div class="b" data-k="CHANNELDOWN">&#8964;</div></div>
  </div>
  <div class="cr">
   <div class="apps"></div>
  </div>
 </div>
 <div class="sl hide"><div class="h"></div><div class="x">&#10005;</div><div class="ll"></div></div>
 <div class="toast"></div>
 <div class="setup hide">
  <h1>Salon</h1><p class="msg"></p>
  <textarea autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
  <div class="save"></div>
 </div>
</div>

  function fin() {
    if (--left > 0) return;
    if (changed || !S.loaded) { S.loaded = true; render(); }
    pollT = setTimeout(poll, fast ? 1000 : 2500);
  }
  for (i = 0; i < ids.length; i++) (function (k, id) {
    if (!id) return;
    api("GET", "/api/states/" + id, null, function (e, j) {
      if (e) {
        if (e.status === 401) { needToken(true); return; }
        if (k === "tv" && e.status !== 404 && !S.netErr) { S.netErr = true; changed = true; }
      } else {
        if (k === "tv" && S.netErr) { S.netErr = false; changed = true; }
        var s = JSON.stringify([j.state, j.attributes]);
        if (s !== S[k + "K"]) { S[k + "K"] = s; S[k] = j; changed = true; }
      }
      fin();
    });
  })(ids[i][0], ids[i][1]);
}

/* ---------------- render ---------------- */
function render() {
  var a = ta(), on = tvOn(), t, cls = "";
  txt($n, CONFIG.name);
  if (S.netErr) { t = L.net; cls = "err"; }
  else if (S.busy === 1) { t = L.turningOn; cls = "wait"; }
  else if (S.busy === 3) { t = L.turningOff; cls = "wait"; }
  else if (S.busy === 2) { t = L.fail; cls = "err"; }
  else if (!S.tv || S.tv.state === "unavailable") { t = L.unavailable; cls = "off"; }
  else if (on) { t = L.on + (a.source ? " · " + a.source : ""); }
  else { t = L.off; cls = "off"; }
  txt($ss, t);
  $sdot.className = "dot" + (cls ? " " + cls : "");
  tglC($pw, "on", on);
  // volume
  var v = curVol();
  $vbi.style.width = (v == null || !on ? 0 : Math.round(v * 100)) + "%";
  txt($volL, on && v != null ? String(Math.round(v * 100)) : L.vol);
  var muted = on && !!a.is_volume_muted;
  if ($mute._m !== muted) { $mute._m = muted; $mute.innerHTML = muted ? IC.mute : IC.spk; }
  tglC($mute, "on", muted);
  // lights
  for (var i = 0; i < $chips.length; i++) {
    var c = $chips[i], k = c.getAttribute("data-l"), st = S[k];
    tglC(c, "on", !!st && st.state === "on");
  }
  // current app
  var tiles = $$(".app", $apps);
  for (var j = 0; j < tiles.length; j++) tglC(tiles[j], "cur", on && tiles[j]._src === a.source);
  if (!hasC($sl, "hide")) renderSources();
}
function curVol() {
  if (S.vloc && ms() - S.vloc.t < 2500) return S.vloc.v;
  var v = ta().volume_level; return typeof v === "number" ? v : null;
}
var toastT = 0;
function toast(m) { txt($toast, m); tglC($toast, "on", true); clearTimeout(toastT); toastT = setTimeout(function () { tglC($toast, "on", false); }, 3500); }

/* ---------------- power ---------------- */
var waitT = 0;
function ensureOn(cb) {
  if (tvOn() && S.busy !== 1) { cb(); return; }
  S.pend.push(cb);
  if (S.busy === 1) return;
  powerOn(true);
}
function powerOn(keepPend) {
  if (!keepPend) S.pend = [];
  call("media_player", "turn_on", { entity_id: CONFIG.tv });
  S.busy = 1; fast = true; render(); poll();
  var n = 0; clearInterval(waitT);
  waitT = setInterval(function () {
    n++;
    if (tvOn()) {
      clearInterval(waitT);
      setTimeout(function () {   // webOS needs a moment after it reports "on"
        S.busy = 0; fast = false;
        var p = S.pend; S.pend = [];
        for (var i = 0; i < p.length; i++) { try { p[i](); } catch (e) { /* */ } }
        render();
      }, 2500);
    } else if (n >= 30) {
      clearInterval(waitT); S.busy = 2; S.pend = []; fast = false; render();
      setTimeout(function () { if (S.busy === 2) { S.busy = 0; render(); } }, 4000);
    }
  }, 1000);
}
function powerToggle() {
  if (S.busy === 1 || S.busy === 3) return;
  if (tvOn()) {
    call("media_player", "turn_off", { entity_id: CONFIG.tv });
    S.busy = 3; fast = true; render();
    var n = 0; clearInterval(waitT);
    waitT = setInterval(function () {
      n++;
      if (!tvOn() || n >= 15) { clearInterval(waitT); S.busy = 0; fast = false; render(); }
    }, 1000);
    poll();
  } else powerOn(false);
}

/* ---------------- sources ---------------- */
function selectSource(src) {
  if (src === "CleanFrame" && CONFIG.cleanframe) {
    // the script turns the TV on and opens CleanFrame by itself
    call("script", "turn_on", { entity_id: CONFIG.cleanframe });
    if (!tvOn()) { S.busy = 1; fast = true; render(); powerWatch(); }
    setTimeout(poll, 800);
    return;
  }
  ensureOn(function () { call("media_player", "select_source", { entity_id: CONFIG.tv, source: src }); setTimeout(poll, 800); });
}
function powerWatch() {
  var n = 0; clearInterval(waitT);
  waitT = setInterval(function () {
    n++;
    if (tvOn() || n >= 30) { clearInterval(waitT); S.busy = tvOn() ? 0 : 2; fast = false; render(); if (S.busy === 2) setTimeout(function () { S.busy = 0; render(); }, 4000); }
  }, 1000);
}
function buildApps() {
  var list = [["CleanFrame", "CleanFrame", "#8aaecf"]].concat(CONFIG.apps).concat([["*", L.all, ""]]);
  var W = $apps.parentNode.clientWidth, cols = W > 560 ? 3 : 2, w = Math.floor((W - cols * 12) / cols);
  if ($apps._w === w) return;
  $apps._w = w; $apps.innerHTML = "";
  var H = $apps.parentNode.clientHeight, rows = Math.max(1, Math.floor((H + 12) / 94)), max = rows * cols;
  if (list.length > max) list = list.slice(0, max - 1).concat([list[list.length - 1]]);
  for (var i = 0; i < list.length; i++) (function (it) {
    var d = document.createElement("div");
    d.className = "app" + (it[0] === "CleanFrame" ? " cf" : "");
    d.style.width = w + "px";
    d._src = it[0];
    d.innerHTML = (it[2] ? '<b style="background:' + it[2] + '"></b>' : "") + "<span></span>";
    d.lastChild.textContent = it[1];
    onTap(d, function () { if (it[0] === "*") openSources(); else selectSource(it[0]); });
    $apps.appendChild(d);
  })(list[i]);
  render();
}
function openSources() { tglC($sl, "hide", false); txt($slh, L.sources); renderSources(); }
function renderSources() {
  var a = ta(), list = a.source_list || [], key = list.join("|") + "#" + (a.source || "") + "#" + tvOn();
  if ($sll._k === key) return;
  $sll._k = key; $sll.innerHTML = "";
  if (!tvOn() || !list.length) { var b = document.createElement("div"); b.className = "bn"; b.textContent = L.noSrc; $sll.appendChild(b); return; }
  for (var i = 0; i < list.length; i++) {
    var d = document.createElement("div"); d.className = "src" + (list[i] === a.source ? " cur" : ""); d.textContent = list[i];
    d.setAttribute("data-s", list[i]); $sll.appendChild(d);
  }
}

/* ---------------- volume ---------------- */
function vol(dir) {
  if (!tvOn()) return;
  var v = curVol();
  if (v != null) { S.vloc = { v: Math.max(0, Math.min(1, v + (dir === "up" ? 0.01 : -0.01))), t: ms() }; render(); }
  call("media_player", dir === "up" ? "volume_up" : "volume_down", { entity_id: CONFIG.tv });
}

/* ---------------- layout ---------------- */
function layout() {
  var port = $card.clientHeight > $card.clientWidth;
  tglC($card, "port", port);
  buildApps();
}

/* ---------------- setup ---------------- */
function needToken(bad) {
  clearTimeout(pollT);
  txt($smsg, bad ? L.badTok : L.setupT); tglC($smsg, "err", !!bad); tglC($setup, "hide", false);
}

/* ---------------- events ---------------- */
function bind() {
  $pw.innerHTML = IC.power;
  onTap($pw, powerToggle);
  var icons = { UP: IC.up, DOWN: IC.down, LEFT: IC.left, RIGHT: IC.right };
  var pk = $$(".pk");
  for (var i = 0; i < pk.length; i++) (function (b) {
    var k = b.getAttribute("data-k");
    if (icons[k]) b.innerHTML = icons[k];
    onTap(b, function () { key(k); }, k === "ENTER" ? null : { repeat: 220 });
  })(pk[i]);
  var nb = $$(".nb"), nbi = { BACK: [IC.back, L.back], HOME: [IC.home, L.home], MENU: [IC.menu, L.menu] };
  for (var j = 0; j < nb.length; j++) (function (b) {
    var k = b.getAttribute("data-k");
    b.innerHTML = nbi[k][0] + "<span></span>"; b.lastChild.textContent = nbi[k][1];
    onTap(b, function () { key(k); });
  })(nb[j]);
  var vb = $$(".rk.vol div[data-v]");
  for (var v = 0; v < vb.length; v++) (function (b) { onTap(b, function () { vol(b.getAttribute("data-v")); }, { repeat: 180 }); })(vb[v]);
  var cb = $$(".rk.ch div[data-k]");
  for (var c = 0; c < cb.length; c++) (function (b) { onTap(b, function () { key(b.getAttribute("data-k")); }); })(cb[c]);
  txt($chL, L.ch);
  onTap($mute, function () { if (tvOn()) call("media_player", "volume_mute", { entity_id: CONFIG.tv, is_volume_muted: !ta().is_volume_muted }, function () { setTimeout(poll, 400); }); });
  var pbi = { REWIND: IC.rew, PLAY: IC.play, PAUSE: IC.pause, FASTFORWARD: IC.ff }, pb = $$(".pb");
  for (var p = 0; p < pb.length; p++) (function (b) { var k = b.getAttribute("data-k"); b.innerHTML = pbi[k]; onTap(b, function () { key(k); }); })(pb[p]);
  // light chips
  for (var q = 0; q < $chips.length; q++) (function (ch) {
    var k = ch.getAttribute("data-l"), id = CONFIG[k];
    if (!id) { tglC(ch, "hide", true); return; }
    txt(ch.lastChild, L[k]);
    onTap(ch, function () {
      var dom = id.split(".")[0];
      if (S[k]) { S[k] = { state: S[k].state === "on" ? "off" : "on", attributes: S[k].attributes }; S[k + "K"] = ""; render(); }
      call(dom === "light" ? "light" : "homeassistant", "toggle", { entity_id: id }, function () { setTimeout(poll, 600); });
    });
  })($chips[q]);
  // sources overlay
  onTap($slx, function () { tglC($sl, "hide", true); });
  var lx = 0, ly = 0, lmv = false, lastT = 0;
  function hit(t) { var r = closest(t, "src", $sll); if (r) { tglC($sl, "hide", true); selectSource(r.getAttribute("data-s")); } }
  $sll.addEventListener("touchstart", function (e) { var t = e.touches[0]; lx = t.clientX; ly = t.clientY; lmv = false; }, false);
  $sll.addEventListener("touchmove", function (e) { var t = e.touches[0]; if (Math.abs(t.clientX - lx) > 8 || Math.abs(t.clientY - ly) > 8) lmv = true; }, false);
  $sll.addEventListener("touchend", function (e) { lastT = ms(); if (lmv) return; e.preventDefault(); hit(e.target); }, false);
  $sll.addEventListener("click", function (e) { if (ms() - lastT > 800) hit(e.target); }, false);
  // token screen: long press on the title
  var lpT = 0, st = $(".st");
  st.addEventListener("touchstart", function () { lpT = setTimeout(function () { needToken(false); }, 2500); }, false);
  st.addEventListener("touchend", function () { clearTimeout(lpT); }, false);
  st.addEventListener("touchmove", function () { clearTimeout(lpT); }, false);
  txt($ssave, L.save);
  onTap($ssave, function () {
    var t = $stok.value.replace(/\s+/g, ""); if (!t) return;
    sset("cfToken", t); TOKEN = t; $stok.value = ""; $stok.blur(); tglC($setup, "hide", true); S.loaded = false; poll();
  });
  document.addEventListener("touchmove", function (e) {
    if (closest(e.target, "ll", document.body)) return;
    if (e.target && e.target.tagName === "TEXTAREA") return;
    e.preventDefault();
  }, false);
  window.addEventListener("orientationchange", function () { setTimeout(layout, 150); }, false);
  window.addEventListener("resize", function () { setTimeout(layout, 80); }, false);
}

function start() {
  bind(); layout(); render();
  readToken();
  if (!TOKEN) { needToken(false); return; }
  poll();
}
start();
if (window.console) console.log("CleanFrame Salon v" + VERSION);
})();
</script>
</body>
