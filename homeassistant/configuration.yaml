# Add these to your configuration.yaml (merge with existing `sensor:` / `shell_command:` keys if you have them),
# then restart Home Assistant once.

# Watches /config/www/photos so the resize script runs as soon as new pictures arrive
# (and is the photo list for photos.html until albums.json exists).
# /config/www is in allowlist_external_dirs by default, so nothing else is needed.
sensor:
  - platform: folder
    folder: /config/www/photos
    filter: "*"

# Shrinks new photos for the 1st-gen iPad, sorts them into albums and writes albums.json
# (see shell/resize_photos.py and automations.yaml).
shell_command:
  resize_photos: python3 /config/shell/resize_photos.py

# Optional helpers (or create them in the UI: Settings → Devices & services → Helpers):
